
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Link Sent | Hakimi Shoes</title>

  <style>
    :root {
      --black: #171311;
      --brown: #7b4d2c;
      --gold: #d2a363;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 25px;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--white);
      background:
        linear-gradient(rgba(20, 14, 10, 0.8), rgba(20, 14, 10, 0.9)),
        url("https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=1800&q=85")
        center/cover;
    }

    .message-box {
      width: 100%;
      max-width: 560px;
      padding: 60px 42px;
      text-align: center;
      background: rgba(23, 19, 17, 0.95);
      border: 1px solid rgba(210, 163, 99, 0.45);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    .success-icon {
      width: 76px;
      height: 76px;
      display: grid;
      place-items: center;
      margin: 0 auto 25px;
      border: 2px solid var(--gold);
      border-radius: 50%;
      color: var(--gold);
      font-size: 2.2rem;
    }

    .brand {
      margin-bottom: 14px;
      color: var(--gold);
      font-size: 0.75rem;
      font-weight: bold;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    h1 {
      margin-bottom: 18px;
      font-family: Georgia, serif;
      font-size: clamp(2.5rem, 6vw, 4.2rem);
      letter-spacing: 1px;
    }

    p {
      max-width: 390px;
      margin: auto;
      color: #ded5cc;
      line-height: 1.7;
    }

    .button {
      display: inline-block;
      margin-top: 30px;
      padding: 14px 27px;
      background: var(--gold);
      color: var(--black);
      font-size: 0.75rem;
      font-weight: bold;
      letter-spacing: 1.2px;
      text-decoration: none;
      text-transform: uppercase;
      transition: 0.25s ease;
    }

    .button:hover {
      background: var(--white);
      transform: translateY(-3px);
    }

    @media (max-width: 500px) {
      .message-box {
        padding: 45px 25px;
      }
    }
  </style>
</head>

<body>
  <main class="message-box">
    <div class="success-icon">✓</div>

    <p class="brand">Hakimi Shoes</p>

    <h1>LINK SENT</h1>

    <p>
      A password-reset link has been sent to your email address. Please check
      your inbox and follow the instructions to reset your password.
    </p>

    <a href="sign in.html" class="button">Back to Sign In</a>
  </main>
</body>
</html>
