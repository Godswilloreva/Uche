  gap: 8px; 
  transition: 1.4s;

}
.product-card :hover{
transform: scale(0.9);
}
.product-card p{

}

.product-img {

}

.product-price {

  font-size: 1.1rem;
  margin: 0;    
  font-size: xx-large; 
  background: gray;  
  border-radius: 8px; 
  cursor: pointer;
}
