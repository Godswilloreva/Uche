
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | Hakimi Shoes</title>

  <style>
    :root {
      --black: #171311;
      --brown: #7b4d2c;
      --gold: #d2a363;
      --cream: #f7f1e9;
      --white: #ffffff;
      --muted: #796f66;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 25px;
      font-family: Arial, Helvetica, sans-serif;
      background:
        linear-gradient(rgba(20, 14, 10, 0.74), rgba(20, 14, 10, 0.86)),
        url("https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=1800&q=85")
        center/cover;
    }

    .card {
      width: 100%;
      max-width: 500px;
      padding: 50px 42px;
      text-align: center;
      background: var(--white);
      box-shadow: 0 20px 55px rgba(0, 0, 0, 0.3);
    }

    .logo {
      color: var(--black);
      font-family: Georgia, serif;
      font-size: 1.4rem;
      font-weight: bold;
      letter-spacing: 2px;
      text-decoration: none;
    }

    .logo span {
      color: var(--gold);
    }

    .icon {
      width: 68px;
      height: 68px;
      display: grid;
      place-items: center;
      margin: 30px auto 20px;
      border-radius: 50%;
      background: #f1e3d2;
      color: var(--brown);
      font-size: 1.8rem;
    }

    h1 {
      color: var(--black);
      font-family: Georgia, serif;
      font-size: clamp(2rem, 5vw, 2.8rem);
      margin-bottom: 12px;
    }

    .description {
      max-width: 360px;
      margin: 0 auto 28px;
      color: var(--muted);
      font-size: 0.94rem;
      line-height: 1.7;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: var(--black);
      text-align: left;
      font-size: 0.75rem;
      font-weight: bold;
      letter-spacing: 0.8px;
    }

    input {
      width: 100%;
      margin-bottom: 18px;
      padding: 14px;
      border: 1px solid #ddd1c4;
      background: #fffcf8;
      color: var(--black);
      font: inherit;
      outline: none;
    }

    input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(210, 163, 99, 0.16);
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      cursor: pointer;
      background: var(--black);
      color: var(--white);
      font-size: 0.75rem;
      font-weight: bold;
      letter-spacing: 1.3px;
      text-transform: uppercase;
      transition: 0.25s ease;
    }

    button:hover {
      background: var(--brown);
    }

    .back {
      display: inline-block;
      margin-top: 25px;
      color: var(--brown);
      font-size: 0.84rem;
      font-weight: bold;
      text-decoration: none;
    }

    .back:hover {
      color: var(--gold);
    }

    @media (max-width: 500px) {
      .card {
        padding: 42px 25px;
      }
    }
  </style>
</head>

<body>
  <main class="card">
    <a href="index.html" class="logo">HAKIMI <span>SHOES</span></a>

    <div class="icon">✉</div>

    <h1>Forgot Password?</h1>

    <p class="description">
      Enter your email address below and we will send you a link to reset your
      password.
    </p>

    <form action="reset.html" method="get">
      <label for="email">EMAIL ADDRESS</label>
      <input
        type="email"
        id="email"
        name="email"
        placeholder="you@example.com"
        required
      />

      <button type="submit">Send Reset Link</button>
    </form>

    <a href="sign in.html" class="back">← Back to Sign In</a>
  </main>
</body>
</html>
