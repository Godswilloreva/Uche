
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Comment Received | Hakimi Shoes</title>

  <style>
    :root {
      --black: #171311;
      --brown: #7b4d2c;
      --gold: #d2a363;
      --cream: #f7f1e9;
      --white: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 25px;
      font-family: Arial, Helvetica, sans-serif;
      background:
        linear-gradient(rgba(20, 14, 10, 0.8), rgba(20, 14, 10, 0.88)),
        url("https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=1800&q=85")
        center/cover;
      color: var(--white);
    }

    .message-card {
      width: 100%;
      max-width: 580px;
      padding: 60px 45px;
      text-align: center;
      background: rgba(23, 19, 17, 0.94);
      border: 1px solid rgba(210, 163, 99, 0.45);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
    }

    .checkmark {
      width: 75px;
      height: 75px;
      margin: 0 auto 25px;
      display: grid;
      place-items: center;
      border: 2px solid var(--gold);
      border-radius: 50%;
      color: var(--gold);
      font-size: 2.3rem;
    }

    .eyebrow {
      color: var(--gold);
      font-size: 0.75rem;
      font-weight: bold;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    h1 {
      margin-bottom: 18px;
      font-family: Georgia, serif;
      font-size: clamp(2.4rem, 6vw, 4.2rem);
      line-height: 1.1;
    }

    p {
      max-width: 410px;
      margin: auto;
      color: #ded5cc;
      line-height: 1.7;
    }

    .button {
      display: inline-block;
      margin-top: 30px;
      padding: 14px 25px;
      background: var(--gold);
      color: var(--black);
      font-size: 0.75rem;
      font-weight: bold;
      letter-spacing: 1px;
      text-decoration: none;
      text-transform: uppercase;
      transition: 0.25s ease;
    }

    .button:hover {
      background: var(--white);
      transform: translateY(-3px);
    }

    @media (max-width: 550px) {
      .message-card {
        padding: 45px 25px;
      }
    }
  </style>
</head>

<body>
  <main class="message-card">
    <div class="checkmark">✓</div>
    <p class="eyebrow">Hakimi Shoes</p>

    <h1>Received Your Comment!</h1>

    <p>
      Thank you for getting in touch. Your comment has been received, and our
      team will review it as soon as possible.
    </p>

    <a href="index.html" class="button">Back to Home</a>
  </main>
</body>
</html>
